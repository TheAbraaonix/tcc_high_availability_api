services:
  blip-api:
    build: .
    container_name: blip-api
    env_file:
      - .env
    environment:      
      - WORKERS=${WORKERS:-1}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - HF_MODEL=${HF_MODEL:-Salesforce/blip-image-captioning-base}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./.cache/huggingface:/app/.cache/huggingface
